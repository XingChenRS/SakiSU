name: ClangFormat check

# SakiSU wind-down: main is frozen; no auto-run on push/PR. Manual runs only.
on:
  workflow_dispatch:

permissions:
  checks: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: check
        working-directory: kernel
        run: make check-format
