name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Download Manager artifacts
        uses: actions/download-artifact@v8
        with:
          path: manager
          pattern: "Manager-*"
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      # SakiSU wind-down: we no longer publish the standalone ksud CLI as a
      # release asset. ksud is still built and embedded inside the Manager APK;
      # only the Manager APK is published, to avoid implying a CLI install path.
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            manager/*.apk
