name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-manager.yml
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Manager artifacts
        uses: actions/download-artifact@v8
        with:
          path: manager
          pattern: "Manager-release"
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      # ksud remains a Manager-internal payload. Release only the production
      # Manager APKs; debug builds and standalone CLI binaries are not assets.
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            manager/*.apk
          fail_on_unmatched_files: true
