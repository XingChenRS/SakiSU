name: Crowdin Action

# Translation synchronization remains manual until SakiSU-specific Crowdin
# ownership and credentials are configured.
on:
  workflow_dispatch:

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    env:
      CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
      CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Skip Crowdin when credentials are absent
      if: ${{ env.CROWDIN_PROJECT_ID == '' || env.CROWDIN_API_TOKEN == '' }}
      run: echo "Crowdin secrets are not configured; skipping translation sync."

    - name: Crowdin Action
      if: ${{ env.CROWDIN_PROJECT_ID != '' && env.CROWDIN_API_TOKEN != '' }}
      uses: crowdin/github-action@v2
      with:
        upload_sources: true
        upload_translations: true
        auto_approve_imported: true
        download_translations: true
        skip_untranslated_files: false
        skip_untranslated_strings: true

        create_pull_request: true
        localization_branch_name: "Crowdin"
        pull_request_labels: 'enhancement, translation'
        pull_request_title: 'manager: sync translation from Crowdin'

        config: 'crowdin.yml'
        crowdin_branch_name: "main"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
