name: Build SakiSU Manager

on:
  push:
    # Tag builds are invoked once by release.yml via workflow_call.
    branches:
      - '**'
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksuinit.yml'
      - 'manager/**'
      - 'kernel/**'
      - 'uapi/**'
      - 'userspace/**'
      - 'repack_apk*.py'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - '.github/workflows/ksuinit.yml'
      - 'manager/**'
      - 'kernel/**'
      - 'uapi/**'
      - 'userspace/**'
      - 'repack_apk*.py'
      - 'scripts/**'
  workflow_dispatch:
  workflow_call:
    secrets:
      BOT_TOKEN:
        required: false

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      is_production: ${{ steps.extract.outputs.is_production }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_alias: ${{ steps.gen.outputs.key_alias }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate isolated build keystore
        id: gen
        run: |
          set -euo pipefail
          KEYSTORE_PASSWORD=$(openssl rand -hex 32)
          KEY_PASSWORD=$(openssl rand -hex 32)
          echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT
          echo "key_alias=ci-key" >> $GITHUB_OUTPUT

          keytool -genkeypair \
            -alias ci-key \
            -keyalg RSA -keysize 2048 \
            -validity 1 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=SakiSU CI Build" \
            -storetype JKS \
            -keystore ci-key.jks

          echo "keystore=$(base64 -w 0 ci-key.jks)" >> $GITHUB_OUTPUT

      - name: Record CI certificate and build class
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
          KEY_ALIAS: ${{ steps.gen.outputs.key_alias }}
          IS_PRODUCTION_REF: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}
        run: |
          set -euo pipefail

          keytool -exportcert \
            -alias "$KEY_ALIAS" \
            -keystore ci-key.jks \
            -storepass "$STORE_PASS" \
            -file ci-cert.der

          SIZE_DEC=$(stat -c%s ci-cert.der)
          SIZE_HEX=$(printf '0x%x' "$SIZE_DEC")
          HASH=$(sha256sum ci-cert.der | awk '{print $1}')

          if [ "$IS_PRODUCTION_REF" = "true" ]; then
            echo "::notice::Production ref: intermediate APKs use an isolated key; only the protected final repack may use the SakiSU production key."
            echo "expected_size=" >> $GITHUB_OUTPUT
            echo "expected_hash=" >> $GITHUB_OUTPUT
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Non-production ref: binding the ephemeral Manager and LKM identities for this run."
            echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT
            echo "expected_hash=$HASH" >> $GITHUB_OUTPUT
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      # Empty on production refs; only non-production Manager/LKM pairs share the CI cert.
      expected_pr_build_size: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_pr_build_hash: ${{ needs.generate-key.outputs.expected_hash || '' }}

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
          - target: armv7-linux-androideabi
            os: ubuntu-latest
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}

  build-manager:
    needs: [generate-key]
    runs-on: ubuntu-latest
    if: always() && needs.generate-key.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"

          - manager_type: "normal"
            build_type: "release"
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine commit for build
        id: commit
        run: |
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Run randomizer
        if: ${{ matrix.manager_type == 'spoofed' }}
        run: |
          chmod +x randomizer
          ./randomizer

      - name: Write signing key
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
        run: |
          set -euo pipefail
          if [ -z "$PR_KEYSTORE" ] || [ -z "$PR_KEYSTORE_PASSWORD" ] || [ -z "$PR_KEY_ALIAS" ] || [ -z "$PR_KEY_PASSWORD" ]; then
            echo "::error::Intermediate CI signing inputs are incomplete."
            exit 1
          fi
          echo "$PR_KEYSTORE" | base64 -d > sign-key.jks
          {
            echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$PR_KEY_ALIAS"
            echo KEY_PASSWORD="$PR_KEY_PASSWORD"
            echo KEYSTORE_FILE='sign-key.jks'
          } >> gradle.properties
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        env:
          KSU_EXPECTED_PR_BUILD_SIZE: ${{ needs.generate-key.outputs.expected_size }}
          KSU_EXPECTED_PR_BUILD_HASH: ${{ needs.generate-key.outputs.expected_hash }}
          IS_PRODUCTION: ${{ needs.generate-key.outputs.is_production }}
        run: |
          EXTRA_ARGS=""
          # Production builds must never ship IS_PR_BUILD / PR cert slots.
          if [ "$IS_PRODUCTION" != "true" ] && [ -n "$KSU_EXPECTED_PR_BUILD_SIZE" ] && [ -n "$KSU_EXPECTED_PR_BUILD_HASH" ]; then
            EXTRA_ARGS="-PIS_PR_BUILD=true"
          else
            unset KSU_EXPECTED_PR_BUILD_SIZE
            unset KSU_EXPECTED_PR_BUILD_HASH
          fi
          ./gradlew assemble${{ matrix.build_type }} -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }} $EXTRA_ARGS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: INTERNAL-DO-NOT-INSTALL-${{ steps.determine.outputs.title }}-${{ matrix.build_type }}
          retention-days: 1
          path: |
            manager/app/build/outputs/apk/release/*.apk
            manager/app/build/outputs/apk/debug/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.determine.outputs.title }}-mappings"
          path: "manager/app/build/outputs/mapping/release/"
          if-no-files-found: ignore

  repack-manager:
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success'
    needs: [build-manager, build-ksud, generate-key]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.generate-key.outputs.is_production == 'true' && 'production-signing' || 'ci' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"
          - manager_type: "normal"
            build_type: "release"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
            name: INTERNAL-DO-NOT-INSTALL-${{ steps.determine.outputs.title }}-${{ matrix.build_type }}
            path: artifacts/INTERNAL-${{ steps.determine.outputs.title }}-${{ matrix.build_type }}
      
      - name: Download Manager-internal arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: manager-internal-ksud-aarch64-linux-android
          path: artifacts/manager-internal-ksud-aarch64-linux-android

      - name: Download Manager-internal x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: manager-internal-ksud-x86_64-linux-android
          path: artifacts/manager-internal-ksud-x86_64-linux-android

      - name: Download Manager-internal arm ksud
        uses: actions/download-artifact@v8
        with:
          name: manager-internal-ksud-armv7-linux-androideabi
          path: artifacts/manager-internal-ksud-armv7-linux-androideabi

      - name: Embed Manager-internal ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/${{ matrix.build_type }}
          APKS=$(find artifacts/INTERNAL-${{ steps.determine.outputs.title }}-${{ matrix.build_type }} -type f -name "*.apk")
          APKS=$(echo "$APKS" | tr '\n' ' ')
          test -n "$APKS"
          cp -f $APKS manager/app/build/outputs/apk/${{ matrix.build_type }}/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/armv7-linux-androideabi/release
          mkdir -p target/x86_64-linux-android/release
          ARM64_KSUD=$(find artifacts/manager-internal-ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          ARMV7_KSUD=$(find artifacts/manager-internal-ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/manager-internal-ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$ARMV7_KSUD"
          test -n "$X86_64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$ARMV7_KSUD" target/armv7-linux-androideabi/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud

      - name: Verify signing identity, repack, and clean credentials
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ needs.generate-key.outputs.is_production == 'true' && secrets.KEYSTORE || '' }}
          PROD_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.is_production == 'true' && secrets.KEYSTORE_PASSWORD || '' }}
          PROD_KEY_ALIAS: ${{ needs.generate-key.outputs.is_production == 'true' && secrets.KEY_ALIAS || '' }}
          PROD_KEY_PASSWORD: ${{ needs.generate-key.outputs.is_production == 'true' && secrets.KEY_PASSWORD || '' }}
          IS_PRODUCTION: ${{ needs.generate-key.outputs.is_production }}
        run: |
          set -euo pipefail
          SIGN_KEYSTORE_FILE=$(mktemp "$RUNNER_TEMP/sakisu-sign.XXXXXX.jks")
          CERT_FILE=$(mktemp "$RUNNER_TEMP/sakisu-cert.XXXXXX.der")
          cleanup_signing_inputs() {
            rm -f "$SIGN_KEYSTORE_FILE" "$CERT_FILE"
            unset SIGN_KEYSTORE_PASSWORD SIGN_KEY_PASSWORD SIGN_KEY_ALIAS
          }
          trap cleanup_signing_inputs EXIT

          if [ "$IS_PRODUCTION" = "true" ]; then
            if [ -z "$PROD_KEYSTORE" ] || [ -z "$PROD_KEYSTORE_PASSWORD" ] || [ -z "$PROD_KEY_ALIAS" ] || [ -z "$PROD_KEY_PASSWORD" ]; then
              echo "::error::Production signing inputs are incomplete. Configure KEYSTORE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD in the protected production-signing Environment."
              exit 1
            fi
            printf '%s' "$PROD_KEYSTORE" | base64 -d > "$SIGN_KEYSTORE_FILE"
            keytool -exportcert \
              -alias "$PROD_KEY_ALIAS" \
              -keystore "$SIGN_KEYSTORE_FILE" \
              -storepass "$PROD_KEYSTORE_PASSWORD" \
              -file "$CERT_FILE"
            CERT_SIZE=$(printf '0x%x' "$(stat -c%s "$CERT_FILE")")
            CERT_HASH=$(sha256sum "$CERT_FILE" | awk '{print $1}')
            OFFICIAL_SIZE=$(awk '/EXPECTED_SIZE_SAKISU/ {print $3; exit}' kernel/manager/manager_sign.h)
            OFFICIAL_HASH=$(awk -F'"' '/EXPECTED_HASH_SAKISU/ {print $2; exit}' kernel/manager/manager_sign.h)
            if [ "$CERT_SIZE" != "$OFFICIAL_SIZE" ] || [ "$CERT_HASH" != "$OFFICIAL_HASH" ]; then
              echo "::error::production-signing certificate $CERT_SIZE/$CERT_HASH does not match manager_sign.h $OFFICIAL_SIZE/$OFFICIAL_HASH."
              exit 1
            fi
            SIGN_KEY_ALIAS="$PROD_KEY_ALIAS"
            SIGN_KEYSTORE_PASSWORD="$PROD_KEYSTORE_PASSWORD"
            SIGN_KEY_PASSWORD="$PROD_KEY_PASSWORD"
          else
            if [ -z "$PR_KEYSTORE" ] || [ -z "$PR_KEYSTORE_PASSWORD" ] || [ -z "$PR_KEY_ALIAS" ] || [ -z "$PR_KEY_PASSWORD" ]; then
              echo "::error::Ephemeral signing inputs are incomplete."
              exit 1
            fi
            printf '%s' "$PR_KEYSTORE" | base64 -d > "$SIGN_KEYSTORE_FILE"
            SIGN_KEY_ALIAS="$PR_KEY_ALIAS"
            SIGN_KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
            SIGN_KEY_PASSWORD="$PR_KEY_PASSWORD"
          fi
          python3 repack_apk_multi.py repack \
            -b ${{ matrix.build_type }} \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Verify final APK signing and output set
        env:
          IS_PRODUCTION: ${{ needs.generate-key.outputs.is_production }}
          EPHEMERAL_HASH: ${{ needs.generate-key.outputs.expected_hash }}
        run: |
          set -euo pipefail
          if [ "$IS_PRODUCTION" = "true" ]; then
            EXPECTED_HASH=$(awk -F'"' '/EXPECTED_HASH_SAKISU/ {print $2; exit}' kernel/manager/manager_sign.h)
          else
            EXPECTED_HASH="$EPHEMERAL_HASH"
          fi
          test -n "$EXPECTED_HASH"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          shopt -s nullglob
          APKS=(dist/*.apk)
          test "${#APKS[@]}" -eq 4
          for ABI in universal arm64-v8a armeabi-v7a x86_64; do
            MATCHES=(dist/*-"$ABI"-release.apk)
            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $ABI release APK, found ${#MATCHES[@]}."
              exit 1
            fi
          done
          for APK in "${APKS[@]}"; do
            VERIFY_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs --min-sdk-version 24 "$APK")
            echo "$VERIFY_OUTPUT"
            echo "$VERIFY_OUTPUT" | grep -q 'Verified using v1 scheme (JAR signing): false'
            echo "$VERIFY_OUTPUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "$VERIFY_OUTPUT" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): false'
            echo "$VERIFY_OUTPUT" | grep -q 'Verified using v3.1 scheme (APK Signature Scheme v3.1): false'
            echo "$VERIFY_OUTPUT" | grep -q 'Verified using v4 scheme (APK Signature Scheme v4): false'
            SIGNER_COUNT=$(echo "$VERIFY_OUTPUT" | grep -c 'Signer #[0-9][0-9]* certificate SHA-256 digest:')
            test "$SIGNER_COUNT" -eq 1
            APK_HASH=$(echo "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')
            if [ "$APK_HASH" != "$EXPECTED_HASH" ]; then
              echo "::error::$APK was signed by $APK_HASH, expected $EXPECTED_HASH."
              exit 1
            fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine.outputs.title }}-${{ matrix.build_type }}
          path: dist/*.apk

  upload-telegram:
    needs: repack-manager
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manager_type: [ "spoofed", "normal" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_SPOOFED_THREAD_ID }}" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_THREAD_ID }}" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.ref }}" != "refs/heads/main" && "${{ github.ref_type }}" != "tag" ]]; then
            echo "topicid=${{ vars.MESSAGE_DEVELOPING_MANAGER_THREAD_ID }}" >> $GITHUB_OUTPUT
          fi
        
      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-release
          path: ./apk/release

      - name: Upload to Telegram
        if: steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ vars.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ steps.determine.outputs.topicid }}
          DEVELOPING_THREAD_ID: ${{ vars.MESSAGE_DEVELOPING_MANAGER_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ steps.determine.outputs.title }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip3 install python-telegram-bot
          export VERSION=$(git rev-list --count HEAD)
          APK_DEBUG=""
          APK_RELEASE=apk/release/*.apk
          python3 $GITHUB_WORKSPACE/scripts/ksubot.py $APK_DEBUG $APK_RELEASE
