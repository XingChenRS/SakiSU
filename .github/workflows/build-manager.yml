name: Build Manager

on:
  push:
    branches: [ "main", "dev", "ci", "sync-upstream", "sync/**" ]
    paths:
      - '.github/workflows/build-manager.yml'
      - '.github/workflows/build-lkm.yml'
      - '.github/workflows/ddk-lkm.yml'
      - '.github/workflows/ksud.yml'
      - 'manager/**'
      - 'kernel/**'
      - 'userspace/**'
      - 'scripts/ksubot.py'
  workflow_call:

jobs:
  generate-key:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      is_production: ${{ steps.extract.outputs.is_production }}
      is_ephemeral: ${{ steps.gen.outputs.is_ephemeral }}
      keystore: ${{ steps.gen.outputs.keystore }}
      keystore_password: ${{ steps.gen.outputs.keystore_password }}
      key_alias: ${{ steps.gen.outputs.key_alias }}
      key_password: ${{ steps.gen.outputs.key_password }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Materialize keystore
        id: gen
        env:
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$PROD_KEYSTORE" ] && [ -n "$PROD_STORE_PASS" ] && [ -n "$PROD_KEY_ALIAS" ] && [ -n "$PROD_KEY_PASS" ]; then
            echo "::notice::Using long-lived keystore from repository secrets."
            echo "$PROD_KEYSTORE" | base64 -d > pr-key.jks
            echo "is_ephemeral=false" >> $GITHUB_OUTPUT
            echo "extract_key_alias=" >> $GITHUB_OUTPUT
            echo "keystore=" >> $GITHUB_OUTPUT
            echo "keystore_password=" >> $GITHUB_OUTPUT
            echo "key_password=" >> $GITHUB_OUTPUT
            echo "key_alias=" >> $GITHUB_OUTPUT
          else
            if [ "$REQUIRE_PRODUCTION" = "true" ]; then
              echo "::error::Production branches (main/dev) require repository secrets KEYSTORE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD matching EXPECTED_*_SAKISU in kernel/manager/manager_sign.h. Ephemeral PR signing is not allowed."
              exit 1
            fi
            echo "::notice::No complete KEYSTORE secret set; generating an ephemeral key for this run."
            KEYSTORE_PASSWORD=$(openssl rand -hex 32)
            KEY_PASSWORD=$(openssl rand -hex 32)
            echo "is_ephemeral=true" >> $GITHUB_OUTPUT
            echo "keystore_password=$KEYSTORE_PASSWORD" >> $GITHUB_OUTPUT
            echo "key_password=$KEY_PASSWORD" >> $GITHUB_OUTPUT
            echo "key_alias=pr-key" >> $GITHUB_OUTPUT
            echo "extract_key_alias=pr-key" >> $GITHUB_OUTPUT

            keytool -genkeypair \
              -alias pr-key \
              -keyalg RSA -keysize 2048 \
              -validity 1 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=SakiSU CI Build" \
              -storetype JKS \
              -keystore pr-key.jks

            echo "keystore=$(base64 -w 0 pr-key.jks)" >> $GITHUB_OUTPUT
          fi

      - name: Extract certificate hash and size
        id: extract
        env:
          STORE_PASS: ${{ steps.gen.outputs.keystore_password }}
          PROD_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ steps.gen.outputs.extract_key_alias }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          IS_EPHEMERAL: ${{ steps.gen.outputs.is_ephemeral }}
          REQUIRE_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
        run: |
          STORE_PASSWORD="$STORE_PASS"
          if [ -z "$STORE_PASSWORD" ]; then
            STORE_PASSWORD="$PROD_STORE_PASS"
          fi
          CERT_ALIAS="$KEY_ALIAS"
          if [ -z "$CERT_ALIAS" ]; then
            CERT_ALIAS="$PROD_KEY_ALIAS"
          fi

          # Export DER certificate
          keytool -exportcert \
            -alias "$CERT_ALIAS" \
            -keystore pr-key.jks \
            -storepass "$STORE_PASSWORD" \
            -file pr-cert.der

          # Calculate size in hex
          SIZE_DEC=$(stat -c%s pr-cert.der)
          SIZE_HEX=$(printf '0x%x' "$SIZE_DEC")

          # Calculate SHA256 hash
          HASH=$(sha256sum pr-cert.der | awk '{print $1}')
          OFFICIAL_SIZE=$(awk '/EXPECTED_SIZE_SAKISU/ {print $3; exit}' kernel/manager/manager_sign.h)
          OFFICIAL_HASH=$(awk -F'"' '/EXPECTED_HASH_SAKISU/ {print $2; exit}' kernel/manager/manager_sign.h)

          echo "Certificate size: $SIZE_HEX ($SIZE_DEC bytes)"
          echo "Certificate hash: $HASH"
          echo "Official SakiSU size/hash: $OFFICIAL_SIZE / $OFFICIAL_HASH"

          if [ "$SIZE_HEX" = "$OFFICIAL_SIZE" ] && [ "$HASH" = "$OFFICIAL_HASH" ]; then
            echo "::notice::Build keystore matches the built-in SakiSU certificate (production)."
            echo "expected_size=" >> $GITHUB_OUTPUT
            echo "expected_hash=" >> $GITHUB_OUTPUT
            echo "is_production=true" >> $GITHUB_OUTPUT
          else
            if [ "$REQUIRE_PRODUCTION" = "true" ]; then
              echo "::error::Production branches (main/dev) require the signing certificate to match EXPECTED_SIZE_SAKISU / EXPECTED_HASH_SAKISU. Update repository KEYSTORE secrets or manager_sign.h."
              exit 1
            fi
            echo "::warning::Non-official signing certificate; marking as PR/debug build."
            echo "expected_size=$SIZE_HEX" >> $GITHUB_OUTPUT
            echo "expected_hash=$HASH" >> $GITHUB_OUTPUT
            echo "is_production=false" >> $GITHUB_OUTPUT
          fi

          if [ "$IS_EPHEMERAL" = "true" ] && [ "$REQUIRE_PRODUCTION" = "true" ]; then
            echo "::error::Ephemeral signing is forbidden on production branches."
            exit 1
          fi

  build-lkm:
    needs: generate-key
    uses: ./.github/workflows/build-lkm.yml
    with:
      # Empty when is_production=true (official SakiSU cert); only set for ephemeral/debug.
      expected_pr_build_size: ${{ needs.generate-key.outputs.expected_size || '' }}
      expected_pr_build_hash: ${{ needs.generate-key.outputs.expected_hash || '' }}
    secrets: inherit

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
          - target: armv7-linux-androideabi
            os: ubuntu-latest
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      os: ${{ matrix.os }}

  build-manager:
    needs: [generate-key]
    runs-on: ubuntu-latest
    if: always() && needs.generate-key.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"

          - manager_type: "normal"
            build_type: "release"
          - manager_type: "normal"
            build_type: "debug"
    defaults:
      run:
        working-directory: ./manager

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine commit for build
        id: commit
        run: |
          echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Run randomizer
        if: ${{ matrix.manager_type == 'spoofed' }}
        run: |
          chmod +x randomizer
          ./randomizer

      - name: Write signing key
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$PROD_KEYSTORE" ] && [ -n "$PROD_KEYSTORE_PASSWORD" ] && [ -n "$PROD_KEY_ALIAS" ] && [ -n "$PROD_KEY_PASSWORD" ]; then
            echo "$PROD_KEYSTORE" | base64 -d > sign-key.jks
            {
              echo KEYSTORE_PASSWORD="$PROD_KEYSTORE_PASSWORD"
              echo KEY_ALIAS="$PROD_KEY_ALIAS"
              echo KEY_PASSWORD="$PROD_KEY_PASSWORD"
              echo KEYSTORE_FILE='sign-key.jks'
            } >> gradle.properties
          else
            echo "$PR_KEYSTORE" | base64 -d > sign-key.jks
            {
              echo KEYSTORE_PASSWORD="$PR_KEYSTORE_PASSWORD"
              echo KEY_ALIAS="$PR_KEY_ALIAS"
              echo KEY_PASSWORD="$PR_KEY_PASSWORD"
              echo KEYSTORE_FILE='sign-key.jks'
            } >> gradle.properties
          fi
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK
        env:
          KSU_EXPECTED_PR_BUILD_SIZE: ${{ needs.generate-key.outputs.expected_size }}
          KSU_EXPECTED_PR_BUILD_HASH: ${{ needs.generate-key.outputs.expected_hash }}
          IS_PRODUCTION: ${{ needs.generate-key.outputs.is_production }}
        run: |
          EXTRA_ARGS=""
          # Production builds must never ship IS_PR_BUILD / PR cert slots.
          if [ "$IS_PRODUCTION" != "true" ] && [ -n "$KSU_EXPECTED_PR_BUILD_SIZE" ] && [ -n "$KSU_EXPECTED_PR_BUILD_HASH" ]; then
            EXTRA_ARGS="-PIS_PR_BUILD=true"
          else
            unset KSU_EXPECTED_PR_BUILD_SIZE
            unset KSU_EXPECTED_PR_BUILD_HASH
          fi
          ./gradlew assemble${{ matrix.build_type }} -Pcommit=${{ steps.commit.outputs.COMMIT_SHA }} $EXTRA_ARGS

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
          path: |
            manager/app/build/outputs/apk/release/*.apk
            manager/app/build/outputs/apk/debug/*.apk

      - name: Upload mappings
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.determine.outputs.title }}-mappings"
          path: "manager/app/build/outputs/mapping/release/"
          if-no-files-found: ignore

  repack-manager:
    if: always() && needs.build-manager.result == 'success' && needs.build-ksud.result == 'success'
    needs: [build-manager, build-ksud, generate-key]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager_type: "spoofed"
            build_type: "release"
          - manager_type: "normal"
            build_type: "release"
          - manager_type: "normal"
            build_type: "debug"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
            name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
            path: artifacts/${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
      
      - name: Download arm64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: artifacts/ksud-aarch64-linux-android

      - name: Download x86_64 ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: artifacts/ksud-x86_64-linux-android

      - name: Download arm ksud
        uses: actions/download-artifact@v8
        with:
          name: ksud-armv7-linux-androideabi
          path: artifacts/ksud-armv7-linux-androideabi

      - name: Place manager apk and ksud artifacts
        run: |
          mkdir -p manager/app/build/outputs/apk/${{ matrix.build_type }}
          APKS=$(find artifacts/${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }} -type f -name "*.apk")
          APKS=$(echo "$APKS" | tr '\n' ' ')
          test -n "$APKS"
          cp -f $APKS manager/app/build/outputs/apk/${{ matrix.build_type }}/

          mkdir -p target/aarch64-linux-android/release
          mkdir -p target/armv7-linux-androideabi/release
          mkdir -p target/x86_64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          ARMV7_KSUD=$(find artifacts/ksud-armv7-linux-androideabi -type f -name ksud | head -n 1)
          X86_64_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD"
          test -n "$ARMV7_KSUD"
          test -n "$X86_64_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$ARMV7_KSUD" target/armv7-linux-androideabi/release/ksud
          cp -f "$X86_64_KSUD" target/x86_64-linux-android/release/ksud

      - name: Prepare signing inputs
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/ci' || github.ref == 'refs/heads/sync-upstream' || startsWith(github.ref, 'refs/heads/sync/') || github.ref_type == 'tag' }}
        env:
          PR_KEYSTORE: ${{ needs.generate-key.outputs.keystore }}
          PR_KEYSTORE_PASSWORD: ${{ needs.generate-key.outputs.keystore_password }}
          PR_KEY_ALIAS: ${{ needs.generate-key.outputs.key_alias }}
          PR_KEY_PASSWORD: ${{ needs.generate-key.outputs.key_password }}
          PROD_KEYSTORE: ${{ secrets.KEYSTORE }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$PROD_KEYSTORE" ] && [ -n "$PROD_KEYSTORE_PASSWORD" ] && [ -n "$PROD_KEY_ALIAS" ] && [ -n "$PROD_KEY_PASSWORD" ]; then
            echo "$PROD_KEYSTORE" | base64 -d > sign-key.jks
            echo "SIGN_KEY_ALIAS=$PROD_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PROD_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PROD_KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "$PR_KEYSTORE" | base64 -d > sign-key.jks
            echo "SIGN_KEY_ALIAS=$PR_KEY_ALIAS" >> $GITHUB_ENV
            echo "SIGN_KEYSTORE_PASSWORD=$PR_KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "SIGN_KEY_PASSWORD=$PR_KEY_PASSWORD" >> $GITHUB_ENV
          fi
          echo "SIGN_KEYSTORE_FILE=sign-key.jks" >> $GITHUB_ENV

      - name: Repack and resign
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/ci' || github.ref == 'refs/heads/sync-upstream' || startsWith(github.ref, 'refs/heads/sync/') || github.ref_type == 'tag' }}
        run: |
          python3 repack_apk_multi.py repack \
            -b ${{ matrix.build_type }} \
            -t release \
            -a arm64-v8a \
            -a armeabi-v7a \
            -a x86_64 \
            -K "$SIGN_KEYSTORE_FILE" \
            -A "$SIGN_KEY_ALIAS" \
            -P "$SIGN_KEYSTORE_PASSWORD" \
            -S "$SIGN_KEY_PASSWORD" \
            --strip

      - name: Delete gradle build
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: ${{ steps.determine.outputs.title }}-gradle-${{ matrix.build_type }}
        
      - name: Upload build artifact
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/ci' || github.ref == 'refs/heads/sync-upstream' || startsWith(github.ref, 'refs/heads/sync/') || github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.determine.outputs.title }}-${{ matrix.build_type }}
          path: dist/*.apk

  upload-telegram:
    needs: repack-manager
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manager_type: [ "spoofed", "normal" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup need_upload
        id: need_upload
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            echo "UPLOAD=true" >> $GITHUB_OUTPUT
          else
            echo "UPLOAD=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine manager variant
        id: determine
        run: |
          if [ "${{ matrix.manager_type }}" == "spoofed" ]; then
            echo "title=Spoofed-Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_SPOOFED_THREAD_ID }}" >> $GITHUB_OUTPUT
          else
            echo "title=Manager" >> $GITHUB_OUTPUT
            echo "topicid=${{ vars.MESSAGE_THREAD_ID }}" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.ref }}" != "refs/heads/main" && "${{ github.ref_type }}" != "tag" ]]; then
            echo "topicid=${{ vars.MESSAGE_DEVELOPING_MANAGER_THREAD_ID }}" >> $GITHUB_OUTPUT
          fi
        
      - name: Download Debug artifact
        if: ${{ matrix.manager_type != 'spoofed' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-debug
          path: ./apk/debug

      - name: Download Release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.determine.outputs.title }}-release
          path: ./apk/release

      - name: Upload to Telegram
        if: steps.need_upload.outputs.UPLOAD == 'true'
        env:
          CHAT_ID: ${{ vars.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MESSAGE_THREAD_ID: ${{ steps.determine.outputs.topicid }}
          DEVELOPING_THREAD_ID: ${{ vars.MESSAGE_DEVELOPING_MANAGER_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ steps.determine.outputs.title }}
          BRANCH: ${{ github.ref_name }}
        run: |
          pip3 install python-telegram-bot
          export VERSION=$(git rev-list --count HEAD)
          if [ ! "${{ matrix.manager_type }}" == "spoofed" ]; then
            APK_DEBUG=apk/debug/*.apk
          else
            APK_DEBUG=""
          fi
          APK_RELEASE=apk/release/*.apk
          python3 $GITHUB_WORKSPACE/scripts/ksubot.py $APK_DEBUG $APK_RELEASE
